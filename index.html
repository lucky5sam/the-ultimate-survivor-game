<!DOCTYPE html>
<!-- data-skin: "flat" = clean standard UI (default) · "raw" = weathered wood/parchment/fire theme.
     Flip to "raw" to activate the material skin defined in src/style.css — no component changes needed. -->
<html lang="" class="dark" data-skin="flat">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Figtree:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    >
    <!-- Font Awesome Free (Solid / Regular / Brands) via CDN. Use with e.g.
         <i class="fa-solid fa-trophy"></i>. Browse icons at fontawesome.com/search?o=r&m=free -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    >
    <title>The Ultimate Survivor Game</title>
    <meta name="description" content="Outdraft. Outscore. Outlast." />

    <!-- Open Graph (link previews in iMessage, Slack, Facebook, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Ultimate Survivor Game" />
    <meta property="og:url" content="https://survivor.lucky5sam.com" />
    <meta property="og:title" content="The Ultimate Survivor Game" />
    <meta property="og:description" content="Outdraft. Outscore. Outlast." />
    <meta property="og:image" content="https://survivor.lucky5sam.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Ultimate Survivor Game" />
    <meta name="twitter:description" content="Outdraft. Outscore. Outlast." />
    <meta name="twitter:image" content="https://survivor.lucky5sam.com/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
